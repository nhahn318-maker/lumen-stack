<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#17164f">
  <title>Lumen Stack</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-rounded, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #17164f; touch-action: manipulation; }
    body { display: grid; place-items: center; }
    button { font: inherit; }
    #app { position: relative; width: min(100vw, 66.667vh); height: min(100vh, 150vw); overflow: hidden; background: #292568; isolation: isolate; }
    #app::before { content: ""; position: absolute; inset: 0; z-index: -2; background: url("./assets/twilight-garden-bg.webp") center/cover no-repeat; }
    #app::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(7,8,48,.18), transparent 55%, rgba(7,8,48,.22)); }
    canvas { width: 100%; height: 100%; display: block; }
    .topbar { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
    .stats { display: flex; gap: 8px; }
    .pill { min-width: 70px; padding: 7px 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 16px; background: rgba(13,14,58,.62); box-shadow: 0 5px 20px rgba(7,8,35,.18); backdrop-filter: blur(8px); }
    .pill small { display: block; color: #c9c9f6; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .pill strong { display: block; color: #fff; font-size: 19px; line-height: 1.1; }
    .controls { display: flex; gap: 7px; pointer-events: auto; }
    .icon-btn { width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; color: #fff; background: rgba(13,14,58,.62); cursor: pointer; }
    .mission { position: absolute; top: max(68px, calc(env(safe-area-inset-top) + 58px)); left: 50%; transform: translateX(-50%); width: min(78%, 310px); padding: 8px 12px; border-radius: 15px; text-align: center; color: #e8e7ff; background: rgba(13,14,58,.52); backdrop-filter: blur(7px); pointer-events: none; }
    .mission-row { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; font-weight: 800; }
    .track { height: 5px; margin-top: 6px; overflow: hidden; border-radius: 9px; background: rgba(255,255,255,.16); }
    #mission-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#72f1c8,#ffd275); transition: width .25s ease; }
    .screen { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: linear-gradient(180deg,rgba(8,8,43,.24),rgba(8,8,43,.52)); transition: opacity .22s ease, visibility .22s ease; }
    .screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .card { width: min(82%, 350px); padding: 30px 24px 34px; border: 1px solid rgba(255,255,255,.2); border-radius: 28px; background: rgba(18,17,68,.68); box-shadow: 0 24px 70px rgba(4,4,32,.35); backdrop-filter: blur(12px); }
    h1 { margin: 0; color: #fff; font-size: clamp(38px, 10vw, 58px); line-height: .92; letter-spacing: -.06em; text-shadow: 0 6px 25px rgba(14,11,72,.45); }
    .primary { width: 100%; min-height: 52px; margin-top: 24px; border: 0; border-radius: 18px; color: #17204c; background: linear-gradient(135deg,#72f1c8,#ffd275); font-weight: 950; letter-spacing: .12em; text-transform: uppercase; box-shadow: 0 9px 0 #bb7e52, 0 17px 35px rgba(4,4,32,.3); cursor: pointer; }
    .primary:active { transform: translateY(5px); box-shadow: 0 4px 0 #bb7e52; }
    .result-score { margin: 8px 0 2px; font-size: 58px; font-weight: 950; color: #ffd275; }
    .result-meta { margin: 0 0 20px; color: #d8d7fa; }
    #toast { position: absolute; left: 50%; top: 29%; transform: translate(-50%,-10px); padding: 9px 15px; border-radius: 99px; color: #17204c; background: #fff3ba; font-weight: 950; font-size: 12px; opacity: 0; pointer-events: none; transition: .2s ease; white-space: nowrap; }
    #toast.show { opacity: 1; transform: translate(-50%,0); }
    #tap-hint { position: absolute; left: 50%; bottom: max(22px, calc(env(safe-area-inset-bottom) + 12px)); transform: translateX(-50%); color: rgba(255,255,255,.9); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; pointer-events: none; text-shadow: 0 2px 10px #15134a; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="app" aria-label="Lumen Stack game">
    <canvas id="game" aria-label="Stack glowing garden platforms"></canvas>
    <section class="topbar" id="hud" hidden>
      <div class="stats">
        <div class="pill"><small>Score</small><strong id="score">0</strong></div>
        <div class="pill"><small>Best</small><strong id="best">0</strong></div>
      </div>
      <div class="controls">
        <button class="icon-btn" id="sound" aria-label="Toggle sound">♪</button>
        <button class="icon-btn" id="pause" aria-label="Pause game">Ⅱ</button>
      </div>
    </section>
    <section class="mission" id="mission" hidden>
      <div class="mission-row"><span id="mission-label">Reach 12 floors</span><span id="mission-count">0 / 12</span></div>
      <div class="track"><div id="mission-fill"></div></div>
    </section>
    <div id="toast" role="status"></div>
    <div id="tap-hint" hidden>Tap anywhere to place</div>

    <section class="screen" id="menu">
      <div class="card">
        <h1>LUMEN<br>STACK</h1>
        <button class="primary" id="start">Play</button>
      </div>
    </section>

    <section class="screen hidden" id="gameover">
      <div class="card">
        <h1>GAME<br>OVER</h1>
        <div class="result-score" id="final-score">0</div>
        <p class="result-meta" id="result-meta">0 floors · Best 0</p>
        <button class="primary" id="restart">Again</button>
      </div>
    </section>
  </main>
  <script src="https://www.youtube.com/game_api/v1"></script>
  <script src="./src/index.js"></script>
</body>
</html>
